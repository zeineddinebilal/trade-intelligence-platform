services:
  - type: web
    name: trade-intel-platform
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GEMINI_API_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: GEMINI_MODEL
        value: gemini-4-carbon
      - key: HUMAN_REVIEW_THRESHOLD
        value: "70"
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: trade-intel-db
          property: connectionString

databases:
  - name: trade-intel-db
    databaseName: trade_intel
    user: trade_intel_user
    plan: free
    postgresMajorVersion: "16"
